[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_PRODUCT_SEARCH_ENABLED = "true"
  VITE_AFFILIATE_SEARCH_ENABLED = "true"
  VITE_MESSENGER_PAGE_URL = "https://m.me/1208338659022658"
  VITE_FACEBOOK_PAGE_URL = "https://www.facebook.com/1208338659022658"
  VITE_API_ORIGIN = "https://bfm-fnrj.onrender.com"

[[redirects]]
  from = "/api/*"
  to = "https://bfm-fnrj.onrender.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/ads.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
